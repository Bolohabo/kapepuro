<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Types of Coffee - Kape Ta Iloilo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Kape Ta Iloilo &#9749;</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="coffee-shops.html">Coffee Shops</a>
            <a href="coffee-beans.html">Coffee Beans</a>
            <a href="brewing-guide.html">Brewing Guide</a>
            <a href="types-of-coffee.html">Types of Coffee</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Types of Coffee</h2>
            <p>Learn about different coffee types, flavors, and origins in Iloilo.</p>
        </div>
    </section>

    <!-- Filter/Search Section -->
    <section class="filters">
        <input type="text" id="coffeeSearch" placeholder="Search coffee type..." />
    </section>

    <!-- Card Grid -->
    <div id="coffeeTypeList"></div>

    <footer>
        <p>&copy; 2026 Kape Ta Iloilo</p>
    </footer>

    <script type="module">
        import { fetchData } from './js/dataService.js';

        const coffeeTypeList = document.getElementById("coffeeTypeList");
        const coffeeSearch = document.getElementById("coffeeSearch");

        async function loadCoffeeTypes() {
            let data = await fetchData("typesofCoffee.json");

            const keyword = coffeeSearch.value.toLowerCase();

            if (keyword) {
                data = data.filter(item =>
                    item.name.toLowerCase().includes(keyword) ||
                    item.description.toLowerCase().includes(keyword)
                );
            }

            displayCoffeeTypes(data);
        }

        function displayCoffeeTypes(data) {
            coffeeTypeList.innerHTML = "";

            if (data.length === 0) {
                coffeeTypeList.innerHTML = "<p style='text-align:center; margin-top:20px;'>No coffee types found.</p>";
                return;
            }

            data.forEach(item => {
                coffeeTypeList.innerHTML += `
                    <div class="card">
                        <img src="${item.image}" alt="${item.name}" class="card-image" loading="lazy">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                    </div>
                `;
            });
        }

        coffeeSearch.addEventListener("input", loadCoffeeTypes);

        // Initial load
        loadCoffeeTypes();
    </script>

</body>

</html>
